<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<!-- Pede ao navegador para não guardar esta página em cache -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Painel Império Hap-on</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  display: flex;
  background: #f4f6fb;
}

.menu {
  width: 250px;
  background: #1a1a2e;
  color: #fff;
  height: 100vh;
  padding: 20px 15px;
}

.menu h2 {
  font-size: 18px;
  margin-bottom: 25px;
}

.menu button {
  display: block;
  width: 100%;
  margin: 6px 0;
  padding: 12px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  background: #ffffff;
  font-weight: 600;
  transition: 0.2s;
}

.menu button:hover {
  background: #4361ee;
  color: #fff;
}

.menu button.active {
  background: #4361ee;
  color: #fff;
}

/* 🔒 Ocultar botões específicos */
button[onclick*="vidas.html"],
button[onclick*="disponivel.html"],
button[onclick*="carteira.html"],
button[onclick*="disparos.html"],
button[onclick*="conversao.html"],
button[onclick*="leads.html"],
button[onclick*="qualidade.html"],
button[onclick*="absenteismo.html"] {
  display: none;
}

iframe {
  flex: 1;
  border: none;
  background: #fff;
}
</style>
</head>

<body>

<div class="menu">
<h2>📊 Império Hap-on</h2>

<button onclick="loadPage('painel-hora-a-hora.html', this)" class="active">Hora a Hora</button>
<button onclick="loadPage('vidas.html', this)">Vidas/Conversão</button>
<button onclick="loadPage('conversao.html', this)">Conversão</button>
<button onclick="loadPage('disponivel.html', this)">Disponível / 1º resposta</button>
<button onclick="loadPage('carteira.html', this)">Carteira de Clientes</button>
<button onclick="loadPage('disparos.html', this)">Disparos</button>
<button onclick="loadPage('leads.html', this)">Leads</button>
<button onclick="loadPage('qualidade.html', this)">Qualidade</button>
<button onclick="loadPage('absenteismo.html', this)">Absenteísmo</button>
</div>

<!-- O endereço da página é colocado pelo script abaixo, sempre com ?v=..., para não abrir uma versão antiga guardada pelo navegador -->
<iframe id="frame" title="Painel"></iframe>

<script>
const PAGINA_INICIAL = 'painel-hora-a-hora.html';
const CONFERIR_A_CADA_MIN = 5;
let paginaAtual = PAGINA_INICIAL;
let versaoAtual = null;

/* Abre a página sempre com um parâmetro novo (?v=...): o navegador entende como endereço novo e busca a versão mais recente */
function abrir(page) {
  paginaAtual = page;
  versaoAtual = null;
  document.getElementById('frame').src = page + '?v=' + Date.now();
  conferirVersao();
}

function loadPage(page, element) {
  abrir(page);
  document.querySelectorAll('.menu button').forEach(btn => {
    btn.classList.remove('active');
  });
  element.classList.add('active');
}

/* Confere no servidor, sem usar cache, se o arquivo da página aberta mudou.
   Se mudou (alguém subiu uma versão nova no GitHub), recarrega o quadro com a versão nova. */
async function conferirVersao() {
  try {
    const r = await fetch(paginaAtual + '?check=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
    if (!r.ok) return;
    const versao = r.headers.get('etag') || r.headers.get('last-modified');
    if (!versao) return;
    if (versaoAtual && versao !== versaoAtual) {
      document.getElementById('frame').src = paginaAtual + '?v=' + Date.now();
    }
    versaoAtual = versao;
  } catch (e) { /* sem conexão: tenta de novo no próximo ciclo */ }
}

abrir(PAGINA_INICIAL);
setInterval(conferirVersao, CONFERIR_A_CADA_MIN * 60 * 1000);
// Ao voltar para a aba (depois de deixar o painel aberto em segundo plano), confere na hora
document.addEventListener('visibilitychange', () => { if (!document.hidden) conferirVersao(); });
</script>

</body>
</html>
