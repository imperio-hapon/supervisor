<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel Império Hap-on</title>
 
<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  display: flex;
  background: #f4f6fb;
}
 
.menu {
  width: 250px;
  background: #1a1a2e;
  color: #fff;
  height: 100vh;
  padding: 20px 15px;
}
 
.menu h2 {
  font-size: 18px;
  margin-bottom: 25px;
}
 
.menu button {
  display: block;
  width: 100%;
  margin: 6px 0;
  padding: 12px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  background: #ffffff;
  font-weight: 600;
  transition: 0.2s;
}
 
.menu button:hover {
  background: #4361ee;
  color: #fff;
}
 
.menu button.active {
  background: #4361ee;
  color: #fff;
}
 
iframe {
  flex: 1;
  border: none;
  background: #fff;
}
</style>
</head>
 
<body>
 
<div class="menu">
<h2>📊 Império Hap-on</h2>

<button onclick="loadPage('vidas.html', this)" style="display:none">
    Vidas / Conversão
</button>

<button onclick="loadPage('eugenia.html', this)" style="display:none">
    EugênIA
</button>

<button onclick="loadPage('disparo.html', this)" class="active">
    Disparos
</button>

<button onclick="loadPage('disponivel.html', this)" style="display:none">
    Disponível / 1º resposta
</button>

<button onclick="loadPage('carteira.html', this)" style="display:none">
    Carteira de Clientes
</button>

<button onclick="loadPage('teste.html', this)" style="display:none">
    Teste
</button>

<button onclick="loadPage('disparos.html', this)" style="display:none">
    Disparos
</button>

<button onclick="loadPage('leads.html', this)" style="display:none">
    Leads
</button>

<button onclick="loadPage('qualidade.html', this)" style="display:none">
    Qualidade
</button>

<button onclick="loadPage('absenteismo.html', this)" style="display:none">
    Absenteísmo
</button>
</div>

<iframe id="frame" src="disparo.html"></iframe>

<script>
function loadPage(page, element){
  document.getElementById('frame').src = page;

  document.querySelectorAll('.menu button').forEach(btn => {
    btn.classList.remove('active');
  });

  element.classList.add('active');
}

// 🔒 BLOCO PARA OCULTAR BOTÕES
function ocultarBotoes() {
  document.getElementById('btnDisparos').style.display = 'none';      
  document.getElementById('btnCarteira de Clientes').style.display = 'none';
  document.getElementById('btnLeads').style.display = 'none';
  document.getElementById('btnQualidade').style.display = 'none';
  document.getElementById('btnAbsenteismo').style.display = 'none';
}

// Executa automaticamente ao carregar
window.onload = function() {
  ocultarBotoes();
};
</script>
 
</body>
</html>
