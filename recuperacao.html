<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ação de Recuperação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F3F6F9;--surface:#FFFFFF;--ink:#15212D;--muted:#5A6A7A;--line:#DAE2EA;--head:#EAF0F5;--accent:#1F5FA8;
  --ok:#1E7F4F;--ok-bg:#E2F3EA;--warn:#9A6200;--warn-bg:#FBF0DA;--bad:#B3261E;--bad-bg:#FBE4E2;--neu:#56636F;--neu-bg:#E9EDF1;--info:#1F5FA8;--info-bg:#E2ECF8;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0E151C;--surface:#16202A;--ink:#E4EBF2;--muted:#95A5B5;--line:#283645;--head:#1C2834;--accent:#78AEEA;
  --ok:#6FD19D;--ok-bg:#16362A;--warn:#F0BE62;--warn-bg:#3A2E14;--bad:#F2908A;--bad-bg:#3D1D1C;--neu:#AAB6C2;--neu-bg:#243140;--info:#8DBBF0;--info-bg:#1A2E47;}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0E151C;--surface:#16202A;--ink:#E4EBF2;--muted:#95A5B5;--line:#283645;--head:#1C2834;--accent:#78AEEA;
  --ok:#6FD19D;--ok-bg:#16362A;--warn:#F0BE62;--warn-bg:#3A2E14;--bad:#F2908A;--bad-bg:#3D1D1C;--neu:#AAB6C2;--neu-bg:#243140;--info:#8DBBF0;--info-bg:#1A2E47;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:28px 48px;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:4px 0 0;font-size:26px;line-height:1.2;font-weight:700;text-wrap:balance}
h2{margin:0;font-size:16px;font-weight:600}
.sub{color:var(--muted);margin:4px 0 0;font-size:13px}
.hctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.dsel{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600}
.dsel select{font-weight:600;color:var(--ink);min-width:150px}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:8px 12px;border-radius:8px;cursor:pointer}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi b{font:500 26px/1.1 "IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--neu-bg);margin-top:10px}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
section{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.colref{font:500 11px "IBM Plex Mono",monospace;color:var(--accent);letter-spacing:.02em}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:28px}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--head);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:600;background:var(--head)}
td.z{color:var(--line)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.p-ok{color:var(--ok);background:var(--ok-bg)}.p-warn{color:var(--warn);background:var(--warn-bg)}.p-bad{color:var(--bad);background:var(--bad-bg)}.p-neu{color:var(--neu);background:var(--neu-bg)}.p-info{color:var(--info);background:var(--info-bg)}
.flag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px}
.mono{font-family:"IBM Plex Mono",monospace;font-size:12.5px}
.filters{display:flex;flex-wrap:wrap;gap:8px}
select{font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
select:focus-visible,.toggle:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-size:13px;font-weight:600;padding:6px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--surface);cursor:pointer}
.btn:disabled{opacity:.6;cursor:default}
.btn:focus-visible,.sortbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sortbtn{all:unset;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--accent);display:inline-flex;gap:4px}
.note{font-size:12px;color:var(--muted);margin:0}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Atualizado em 02/10/2026</div>
      <h1>Resultado das ligações de recuperação</h1>
    </div>
    <div class="hctl">
      <label class="dsel" for="fD"><span>Data</span><select id="fD"></select></label>
    </div>
  </header>

  <div>
    <div class="kpis" id="kpis"></div>
    <div class="bar" id="bar"></div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="grid2">
    <section>
      <div class="sec-head"><h2>Atendimento por tentativa</h2><span class="colref">I × J</span></div>
      <div class="tbl"><table id="t1"></table></div>
    </section>
    <section>
      <div class="sec-head"><h2>Resultado das ligações atendidas</h2><span class="colref">K + L</span></div>
      <div class="tbl"><table id="t2"></table></div>
      <p class="note">Só aparecem aqui os registros com J = "Sim, cliente atendeu".</p>
    </section>
  </div>

  <section>
    <div class="sec-head"><h2>Atendimento por promotor(a)</h2><span class="colref">Nome × J</span></div>
    <div class="tbl"><table id="t3"></table></div>
  </section>

  <section>
    <div class="sec-head"><h2>Registros</h2>
      <div class="filters">
        <select id="fI" aria-label="Filtrar por tentativa"></select>
        <select id="fJ" aria-label="Filtrar por atendimento"></select>
        <button type="button" class="btn" id="exp" hidden>Exportar .xlsx</button>
      </div>
    </div>
    <div class="tbl"><table id="t4"></table></div>
    <p class="note" id="n4"></p>
    <p class="note" id="expMsg" role="status"></p>
  </section>
</div>

const JORD=["Sim, cliente atendeu","Caixa postal","Não atendeu","Cliente recusou a ligação"];
const JCLS={"Sim, cliente atendeu":"ok","Caixa postal":"warn","Não atendeu":"neu","Cliente recusou a ligação":"bad"};
const JVAR={ok:"--ok",warn:"--warn",neu:"--neu",bad:"--bad"};
const IORD=["1ª tentativa","2ª tentativa","3ª tentativa"];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pillJ=j=>`<span class="pill p-${JCLS[j]||'neu'}">${esc(j)}</span>`;
const pillK=k=>{if(!k)return'<span style="color:var(--muted)">—</span>';const c=k.includes('Sem interesse')?'bad':k.includes('Improdutivo')?'neu':k.includes('Seguiu')?'info':'ok';return `<span class="pill p-${c}">${esc(k.replace(/^[^\p{L}]+/u,''))}</span>`};
const cnt=(a,f)=>a.filter(f).length;
const pct=(a,b)=>b?Math.round(a/b*100)+'%':'—';
let sortI=0,CUR=[];
const $=id=>document.getElementById(id);
$('fI').innerHTML='<option value="">Todas as tentativas</option>'+IORD.map(i=>`<option>${i}</option>`).join('');
$('fJ').innerHTML='<option value="">Todos os atendimentos</option>'+JORD.map(j=>`<option>${j}</option>`).join('');
const fmtD=d=>d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4);
$('fD').innerHTML='<option value="">Todas as datas</option>'+[...new Set(ROWS.filter(r=>!r.teste).map(r=>r.ini.slice(0,10)))].sort().map(d=>`<option value="${d}">${fmtD(d)}</option>`).join('');

function render(){
  const fd=$('fD').value;
  const R=ROWS.filter(r=>!r.teste&&(!fd||r.ini.slice(0,10)===fd));
  const tel=new Set(R.map(r=>r.tel.replace(/\D/g,'').slice(-8)));
  const at=cnt(R,r=>r.J===JORD[0]);
  $('kpis').innerHTML=[
    [R.length,'registros de ligação'],[tel.size,'telefones distintos'],[at,'ligações atendidas'],[pct(at,R.length),'taxa de atendimento']
  ].map(([v,l])=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join('');
  $('bar').innerHTML=JORD.map(j=>{const n=cnt(R,r=>r.J===j);return n?`<i style="width:${n/R.length*100}%;background:var(${JVAR[JCLS[j]]})" title="${j}: ${n}"></i>`:''}).join('');
  $('legend').innerHTML=JORD.map(j=>`<span><i style="background:var(${JVAR[JCLS[j]]})"></i>${j} · ${cnt(R,r=>r.J===j)}</span>`).join('');

  // T1
  let h='<thead><tr><th>Tentativa</th>'+JORD.map(j=>`<th class="n">${j.replace('Sim, cliente atendeu','Atendeu').replace('Cliente recusou a ligação','Recusou')}</th>`).join('')+'<th class="n">Total</th><th class="n">% atend.</th></tr></thead><tbody>';
  const row=(lbl,S,cls='')=>`<tr class="${cls}"><td>${lbl}</td>`+JORD.map(j=>{const n=cnt(S,r=>r.J===j);return `<td class="n${n?'':' z'}">${n}</td>`}).join('')+`<td class="n">${S.length}</td><td class="n">${pct(cnt(S,r=>r.J===JORD[0]),S.length)}</td></tr>`;
  IORD.forEach(i=>h+=row(i,R.filter(r=>r.I===i)));
  h+=row('Total',R,'tot')+'</tbody>';$('t1').innerHTML=h;

  // T2
  const A=R.filter(r=>r.J===JORD[0]);const g={};
  A.forEach(r=>{const k=r.K+'@@'+r.L;g[k]=(g[k]||0)+1});
  h='<thead><tr><th>Resultado (K)</th><th>Motivo (L)</th><th class="n">Qtd</th><th class="n">%</th></tr></thead><tbody>';
  Object.entries(g).sort((a,b)=>b[1]-a[1]).forEach(([k,n])=>{const [K,L]=k.split('@@');h+=`<tr><td>${pillK(K)}</td><td>${L?esc(L):'<span style="color:var(--muted)">—</span>'}</td><td class="n">${n}</td><td class="n">${pct(n,A.length)}</td></tr>`});
  if(!A.length)h+='<tr><td colspan="4" style="color:var(--muted)">Nenhuma ligação atendida neste período.</td></tr>';
  h+=`<tr class="tot"><td colspan="2">Total atendidas</td><td class="n">${A.length}</td><td class="n">${A.length?'100%':'—'}</td></tr></tbody>`;$('t2').innerHTML=h;

  // T3
  const rate=o=>{const S=R.filter(r=>r.op===o);return S.length?cnt(S,r=>r.J===JORD[0])/S.length:0};
  const ops=[...new Set(R.map(r=>r.op))].sort((a,b)=>rate(b)-rate(a)||cnt(R,r=>r.op===b)-cnt(R,r=>r.op===a));
  h='<thead><tr><th>Promotor(a)</th>'+JORD.map(j=>`<th class="n">${j.replace('Sim, cliente atendeu','Atendeu').replace('Cliente recusou a ligação','Recusou')}</th>`).join('')+'<th class="n">Total</th><th class="n">% atend. ↓</th></tr></thead><tbody>';
  ops.forEach(o=>h+=row(esc(o),R.filter(r=>r.op===o)));
  h+=row('Total',R,'tot')+'</tbody>';$('t3').innerHTML=h;

  // T4
  const fi=$('fI').value,fj=$('fJ').value;
  const F=R.filter(r=>(!fi||r.I===fi)&&(!fj||r.J===fj));
  if(sortI)F.sort((a,b)=>sortI*(a.I.localeCompare(b.I))||a.id-b.id);
  CUR=F;
  h='<thead><tr><th>Concluído em</th><th>Promotor(a)</th><th>Cliente</th><th>Telefone</th><th aria-sort="'+(sortI?(sortI>0?'ascending':'descending'):'none')+'"><button type="button" class="sortbtn" id="sortI">Tentativa (I) <span>'+(sortI>0?'↑':sortI<0?'↓':'↕')+'</span></button></th><th>Atendida (J)</th><th>Resultado (K)</th><th>Motivo (L)</th></tr></thead><tbody>';
  F.forEach(r=>h+=`<tr><td class="mono">${esc(r.fim.slice(8,10)+'/'+r.fim.slice(5,7)+' '+r.fim.slice(11))}</td><td>${esc(r.op)}</td><td>${esc(r.cli)}${r.trocado?'<span class="flag">nome/telefone invertidos na origem</span>':''}</td><td class="mono">${esc(r.tel)}</td><td>${esc(r.I)}</td><td>${pillJ(r.J)}</td><td>${pillK(r.K)}</td><td>${esc(r.L)||'<span style="color:var(--muted)">—</span>'}</td></tr>`);
  if(!F.length)h+='<tr><td colspan="8" style="color:var(--muted)">Nenhum registro com esses filtros.</td></tr>';
  $('t4').innerHTML=h+'</tbody>';
  $('sortI').onclick=()=>{sortI=sortI===0?1:sortI===1?-1:0;render()};
  $('n4').textContent=`${F.length} de ${R.length} registros.`+(fd?` Data de início: ${fmtD(fd)}.`:'');
}
$('fI').addEventListener('change',render);$('fJ').addEventListener('change',render);$('fD').addEventListener('change',render);
render();
(()=>{
  const b=$('exp');if(!window.XLSX)return;b.hidden=false;
  b.addEventListener('click',()=>{
    const m=$('expMsg');
    try{
      const f=d=>d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4)+' '+d.slice(11);
      const data=CUR.map(r=>({'Hora de início':f(r.ini),'Concluído em':f(r.fim),'Promotor(a)':r.op,'Cliente':r.cli,'Telefone':r.tel,'Tentativa (I)':r.I,'Atendida (J)':r.J,'Resultado (K)':r.K.replace(/^[^\p{L}]+/u,''),'Motivo (L)':r.L}));
      const ws=XLSX.utils.json_to_sheet(data);
      ws['!cols']=[16,16,30,32,16,14,26,36,44].map(w=>({wch:w}));
      ws['!autofilter']={ref:ws['!ref']};
      const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Registros');
      XLSX.writeFile(wb,'Registros Ação de Recuperação 02102026.xlsx');
      m.textContent=`Arquivo exportado com ${data.length} registros.`;
    }catch(e){m.textContent='Não foi possível exportar.'}
  });
})();
</script>
