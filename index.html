<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel Império Hap-on</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  display: flex;
  background: #f4f6fb;
}

.menu {
  width: 250px;
  background: #1a1a2e;
  color: #fff;
  height: 100vh;
  padding: 20px 15px;
}

.menu h2 {
  font-size: 18px;
  margin-bottom: 25px;
}

.menu button {
  display: block;
  width: 100%;
  margin: 6px 0;
  padding: 12px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  background: #ffffff;
  font-weight: 600;
  transition: 0.2s;
}

.menu button:hover {
  background: #4361ee;
  color: #fff;
}

.menu button.active {
  background: #4361ee;
  color: #fff;
}

/* 🔒 Botões ocultos: para voltar a exibir um botão, retire a classe "oculto" dele */
.menu button.oculto {
  display: none;
}

iframe {
  flex: 1;
  border: none;
  background: #fff;
}
</style>
</head>

<body>

<div class="menu">
<h2>📊 Império Hap-on</h2>

<!-- Botões visíveis -->
<button onclick="loadPage(URL_HORA_A_HORA, this)" class="active">Hora a Hora</button>
<button onclick="loadPage('funil.html', this)">Painel de Leads</button>
<button onclick="loadPage('carteira.html', this)">Controle de Acionamentos</button>
<button onclick="loadPage('disponivel.html', this)">Jornada da Equipe</button>
<button onclick="loadPage('Consolidado_Semanal.html', this)">Consolidado Semanal</button>

<!-- Botões ocultos (mantidos no código para reativar se precisar) -->
<button class="oculto" onclick="loadPage('Painel_Gerencial.html', this)">Painel Gerencial</button>
<button class="oculto" onclick="loadPage('vidas.html', this)">Vidas/Conversão</button>
<button class="oculto" onclick="loadPage('conversao.html', this)">Conversão</button>
<button class="oculto" onclick="loadPage('disponivel.html', this)">Disponível / 1º resposta</button>
<button class="oculto" onclick="loadPage('carteira.html', this)">Carteira de Clientes</button>
<button class="oculto" onclick="loadPage('disparos.html', this)">Disparos</button>
<button class="oculto" onclick="loadPage('leads.html', this)">Leads</button>
<button class="oculto" onclick="loadPage('qualidade.html', this)">Qualidade</button>
<button class="oculto" onclick="loadPage('absenteismo.html', this)">Absenteísmo</button>
</div>

<!-- O endereço da página é colocado pelo script abaixo, sempre com ?v=..., para não abrir uma versão antiga guardada pelo navegador -->
<iframe id="frame" title="Painel"></iframe>

<script>
/* Ao mudar este arquivo, troque também este número (qualquer valor novo serve).
   Quem estiver com o menu antigo aberto recebe o novo sozinho, sem limpar cache. */
const VERSAO_MENU = '2026-10-27-1';

/* Endereço do Painel Hora a Hora publicado no GitHub Pages (site imperio-hapon.github.io/supervisor).
   Se o endereço do site for outro, troque só esta linha. */
const URL_HORA_A_HORA = 'https://imperio-hapon.github.io/supervisor/painel-hora-a-hora.html';

/* Página que abre primeiro: o Painel Hora a Hora */
const PAGINA_INICIAL = URL_HORA_A_HORA;
const CONFERIR_A_CADA_MIN = 2;
let paginaAtual = PAGINA_INICIAL;
let assinaturaAtual = null;
const frame = document.getElementById('frame');

/* Lê um arquivo do site sem usar nada guardado no navegador (endereço novo + no-store) */
async function lerSemCache(arquivo) {
  const r = await fetch(arquivo + (arquivo.includes('?') ? '&' : '?') + 'check=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.text();
}

/* "Assinatura" da página: a marca de versão (data-gerado) quando existir; senão, o tamanho e o fim do arquivo */
function assinatura(txt) {
  const m = txt.match(/data-gerado="([^"]+)"/);
  return m ? m[1] : txt.length + ':' + txt.slice(-200);
}

/* Abre a página sempre com um parâmetro novo (?v=...): o navegador entende como endereço novo e busca a versão mais recente */
function abrir(page) {
  paginaAtual = page;
  assinaturaAtual = null;
  frame.src = page + '?v=' + Date.now();
  conferir();
}

function loadPage(page, element) {
  abrir(page);
  document.querySelectorAll('.menu button').forEach(btn => btn.classList.remove('active'));
  element.classList.add('active');
}

async function conferir() {
  try {
    // 1) o próprio menu (index.html) mudou? recarrega por um endereço novo
    const idx = await lerSemCache(location.pathname.endsWith('/') ? location.pathname + 'index.html' : location.pathname);
    const m = idx.match(/const VERSAO_MENU = '([^']+)'/);
    if (m && m[1] !== VERSAO_MENU) { location.replace(location.pathname + '?v=' + Date.now()); return; }
    // 2) a página aberta no quadro mudou? recarrega só o quadro
    const pagina = paginaAtual;
    const sig = assinatura(await lerSemCache(pagina));
    if (pagina !== paginaAtual) return;
    if (assinaturaAtual && sig !== assinaturaAtual) frame.src = pagina + '?v=' + Date.now();
    assinaturaAtual = sig;
  } catch (e) { /* sem conexão: tenta de novo no próximo ciclo */ }
}

abrir(PAGINA_INICIAL);
setInterval(conferir, CONFERIR_A_CADA_MIN * 60 * 1000);
// Ao voltar para a aba (depois de deixar o painel aberto em segundo plano), confere na hora
document.addEventListener('visibilitychange', () => { if (!document.hidden) conferir(); });
</script>

</body>
</html>
